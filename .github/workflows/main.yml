name: Headlock Zenis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Xcode Config File
        run: |
          FILE="ThreeOneOSFive.xcodeproj/project.pbxproj"
          
          perl -pi -e 's/^\xEF\xBB\xBF//' "$FILE"
          perl -pi -e 's/\r\n/\n/g' "$FILE"
          perl -pi -e 's/\r/\n/g' "$FILE"
          
          echo "Đã làm sạch file cấu hình dự án!"

      - name: Build App
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          
          # Tìm file .app trong thư mục build mặc định
          APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)
          
          # Phương án dự phòng: nếu không có trong build/, tìm trong DerivedData
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          echo "Đã tìm thấy app tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa
