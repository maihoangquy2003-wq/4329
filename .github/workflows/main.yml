name: Headlock Zenis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix PBXProj Encoding and Hidden Characters
        run: |
          PBX_PATH="ThreeOneOSFive.xcodeproj/project.pbxproj"
          sed -i '' '1s/^\xEF\xBB\xBF//' "$PBX_PATH" 2>/dev/null || sed -i '1s/^\xEF\xBB\xBF//' "$PBX_PATH"
          tr -d '\r' < "$PBX_PATH" > "${PBX_PATH}_tmp" && mv "${PBX_PATH}_tmp" "$PBX_PATH"
          echo "Đã làm sạch file project.pbxproj thành công!"

      - name: Build App
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_BUILD=$(find build ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          cp -r "$APP_BUILD" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa
