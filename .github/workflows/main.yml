name: Headlock Zenis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Xcode Config File
        run: |
          FILE="ThreeOneOSFive.xcodeproj/project.pbxproj"
          
          # Dùng Perl để tiêu diệt ký tự tàng hình BOM (nguyên nhân gây lỗi dòng 1)
          perl -pi -e 's/^\xEF\xBB\xBF//' "$FILE"
          
          # Ép định dạng ngắt dòng về chuẩn Mac/Linux (tránh lỗi do trình duyệt lưu nhầm chuẩn Windows)
          perl -pi -e 's/\r\n/\n/g' "$FILE"
          perl -pi -e 's/\r/\n/g' "$FILE"
          
          echo "Đã làm sạch file cấu hình dự án!"

      - name: Build App
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -derivedDataPath build_output \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Tìm file .app trong thư mục build_output xuất ra
          APP_PATH=$(find build_output -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa
