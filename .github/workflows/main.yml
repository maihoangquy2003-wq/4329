name: Headlock Zenis - Debug & Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnostic & Clean Project File
        run: |
          FILE="ThreeOneOSFive.xcodeproj/project.pbxproj"
          
          echo "=== 1. Kiểm tra sự tồn tại của file ==="
          if [ ! -f "$FILE" ]; then
            echo "LỖI: Không tìm thấy file $FILE!"
            exit 1
          fi

          echo "=== 2. Kiểm tra mã hóa và dọn dẹp ký tự ẩn (BOM/CRLF) ==="
          # Xóa BOM và chuẩn hóa ngắt dòng thành chuẩn LF của Unix/Mac
          perl -pi -e 's/^\xEF\xBB\xBF//' "$FILE"
          perl -pi -e 's/\r\n/\n/g' "$FILE"
          perl -pi -e 's/\r/\n/g' "$FILE"

          echo "=== 3. Quét lỗi cú pháp file PBXProj (Linting) ==="
          # Lệnh plutil sẽ báo chính xác dòng bị sai cú pháp nếu file cấu hình bị rách/lỗi ngoặc
          if plutil -lint "$FILE"; then
            echo "SUCCESS: File project.pbxproj chuẩn cú pháp 100%!"
          else
            echo "LỖI CÚ PHÁP: File project.pbxproj đang bị hỏng cú pháp (thiếu ngoặc, thiếu dấu phẩy hoặc dính conflict Git)!"
            echo "=== Nội dung 10 dòng đầu tiên của file để kiểm tra ==="
            head -n 10 "$FILE"
            exit 1
          fi

      - name: Build App (All Targets)
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          
          # Tìm file .app được build ra
          APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy file .app nào sau khi build!"
            exit 1
          fi
          
          echo "Đã tìm thấy app tại: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa
