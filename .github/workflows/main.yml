name: Headlock Zenis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deep Clean Project File Encoding
        run: |
          python3 -c '
          import os
          path = "ThreeOneOSFive.xcodeproj/project.pbxproj"
          if not os.path.exists(path):
              print(f"LỖI: Không tìm thấy file {path}")
              exit(1)
              
          with open(path, "rb") as f:
              raw = f.read()
              
          try:
              # Giải mã và tự động xóa ký tự BOM (Byte Order Mark) tàng hình
              text = raw.decode("utf-8-sig")
          except UnicodeDecodeError:
              # Dự phòng nếu file vô tình bị lưu dưới dạng UTF-16
              text = raw.decode("utf-16")
              
          # Xóa toàn bộ khoảng trắng, dấu tab, khoảng lùi bị kẹt ở ngay dòng 1
          text = text.lstrip()
          
          # Chuẩn hóa toàn bộ ngắt dòng về chuẩn LF của máy Mac
          text = text.replace("\r\n", "\n").replace("\r", "\n")
          
          # Ghi đè lại file bằng chuẩn UTF-8 sạch 100%
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(text)
              
          print("✅ Đã làm sạch và phục hồi file project.pbxproj thành công!")
          '

      - name: Build App
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_BUILD=$(find build ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          cp -r "$APP_BUILD" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa
