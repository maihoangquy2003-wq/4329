name: Headlock Zenis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Project File Encoding and Line Endings
        run: |
          # Đảm bảo file pbxproj không bị lỗi định dạng dòng hoặc ký tự lạ ẩn ở đầu
          PBX_PATH="ThreeOneOSFive.xcodeproj/project.pbxproj"
          if [ -f "$PBX_PATH" ]; then
            echo "Đang làm sạch file project.pbxproj..."
            # Chuyển đổi định dạng ngắt dòng về chuẩn LF của Mac/Linux
            dos2unix "$PBX_PATH" 2>/dev/null || true
          else
            echo "LỖI: Không tìm thấy file project.pbxproj!"
            exit 1
          fi

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build 2>&1 | tee xcode_build_output.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy file .app nào!"
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-error-logs
          path: xcode_build_output.log
