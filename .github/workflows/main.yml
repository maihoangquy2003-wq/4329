name: Headlock Zenis - Debug Mode

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan & Diagnose Project Files
        run: |
          echo "=========================================="
          echo "1. KIỂM TRA ĐỊNH DẠNG VÀ NỘI DUNG 5 DÒNG ĐẦU CỦA PROJECT"
          echo "=========================================="
          PBX_PATH="ThreeOneOSFive.xcodeproj/project.pbxproj"
          if [ -f "$PBX_PATH" ]; then
            echo "Đường dẫn file tồn tại: $PBX_PATH"
            echo "--- 5 dòng đầu tiên của file ---"
            head -n 5 "$PBX_PATH"
            echo "---------------------------------"
          else
            echo "LỖI NGHIÊM TRỌNG: Không tìm thấy file $PBX_PATH!"
            exit 1
          fi

      - name: Build App & Dump Full Logs
        run: |
          set -o pipefail
          echo "=========================================="
          echo "2. BẮT ĐẦU BUILD VÀ QUÉT TOÀN BỘ LỖI"
          echo "=========================================="
          
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -alltargets \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build 2>&1 | tee xcode_build_output.log || {
            echo "=========================================="
            echo "PHÁT HIỆN LỖI XCODEBUILD! ĐANG IN RA 50 DÒNG LOG CUỐI:"
            echo "=========================================="
            tail -n 50 xcode_build_output.log
            exit 1
          }

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "LỖI: Không tìm thấy file .app nào sau khi build xong!"
            exit 1
          endif
          
          cp -r "$APP_PATH" Payload/
          zip -r HeadlockZenis.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadlockZenis-IPA
          path: HeadlockZenis.ipa

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-xcode-error-logs
          path: xcode_build_output.log
