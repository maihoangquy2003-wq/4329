name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme ThreeOneOSFive \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/ThreeOneOSFive.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean archive

      - name: Export Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ThreeOneOSFive.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r ThreeOneOSFive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-Build
          path: build/ThreeOneOSFive.ipa
